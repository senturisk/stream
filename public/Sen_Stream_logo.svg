<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="128" fill="#f6f2fc" />
  <g transform="translate(256, 256) rotate(-45)">
    <!-- Central donut ring -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#7135b5" stroke-width="38" />
    
    <!-- Top-left concentric arcs -->
    <path d="M -80,0 A 80,80 0 0,1 0,-80" fill="none" stroke="#7135b5" stroke-width="36" stroke-linecap="round" />
    <path d="M -132,0 A 132,132 0 0,1 0,-132" fill="none" stroke="#7135b5" stroke-width="36" stroke-linecap="round" />
    
    <!-- Bottom-right concentric arcs -->
    <path d="M 80,0 A 80,80 0 0,1 0,80" fill="none" stroke="#7135b5" stroke-width="36" stroke-linecap="round" />
    <path d="M 132,0 A 132,132 0 0,1 0,132" fill="none" stroke="#7135b5" stroke-width="36" stroke-linecap="round" />
  </g>
</svg>
